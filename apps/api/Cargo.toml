[package]
name = "ruchoir-api"
version = "0.0.0"
description = "Ruchoir backend: HTTP/real-time API and static web host."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "ruchoir-api"
path = "src/main.rs"

[features]
default = []
# Opt-in dev TLS (self-signed certs). Off by default so the standard build and CI
# stay provider-free. See scripts/dev-tls.sh and docs for usage.
tls = ["dep:axum-server", "dep:rustls"]

[dependencies]
tokio = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
futures-util = { workspace = true }
tokio-stream = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
dotenvy = { workspace = true }
utoipa = { workspace = true }
axum-server = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }

# The office relay and the engine's discovery: an HTTP client over the same hyper the server runs on.
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
http-body-util = "0.1"
# The office relay's WebSocket client (the co-editing socket). Snapview GmbH, Germany; the same
# version axum's own WebSocket support is built on.
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect"] }

# The calendar: recurrence rules (RFC 5545) expanded in the event's own time zone, and the iCal
# subscription file. `rrule` is a community project led by an independent maintainer (Fredrik
# Meringdal), `icalendar` by Hendrik Sollich (Dresden, Germany; its parser pulls `nom-language`, by
# Geoffroy Couprie, France), `chrono` and `chrono-tz` by the
# community chronotope project; all MIT or Apache-2.0. `chrono` is what `rrule` speaks and stays
# inside `calendar/`: everything outside it uses `time`.
rrule = "0.14"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
chrono-tz = "0.10.4"
icalendar = { version = "0.17.14", default-features = false, features = ["parser"] }

# Data layer: PostgreSQL via SeaORM, Valkey via fred, migrations from the workspace crate.
sea-orm = { workspace = true }
fred = { workspace = true }
ruchoir-migration = { path = "../../migrations" }

# Auth: argon2id hashing, CSPRNG, ids, cookie handling.
argon2 = { workspace = true }
getrandom = { workspace = true }
uuid = { workspace = true }
time = { workspace = true }
axum-extra = { workspace = true }
tower_governor = { workspace = true }
lettre = { workspace = true }
sha2 = { workspace = true }
sha1 = { workspace = true }
hmac = { workspace = true }
totp-rs = { workspace = true }
aes-gcm = { workspace = true }
zeroize = { workspace = true }
qrcodegen = { workspace = true }
webauthn-rs = { workspace = true }

# Files / object storage: S3 client, image thumbnails, MIME sniffing.
rust-s3 = { workspace = true }
image = { workspace = true }
# Link preview cards: SVG templates rendered to PNG.
resvg = { workspace = true }
infer = { workspace = true }

# Import: opening the sealed archive our export tooling produces, and streaming the tar inside it.
pgp = { workspace = true }
tar = { workspace = true }

# Notifications past the open page: VAPID signing and the push-service client.
p256 = { workspace = true }
ureq = { workspace = true }

[dev-dependencies]
# End-to-end tests bind the real server and drive it over the loopback: a plain-HTTP client for the
# REST surface and a WebSocket client for the real-time push. Both are TLS-free (loopback only) and
# dev-only, so they never enter the production binary (golden rule #2 targets runtime services and
# infrastructure, not locally-run test tooling).
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect"] }
futures-util = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "sync"] }
