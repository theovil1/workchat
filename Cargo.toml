# Cargo workspace root for the Ruchoir backend.
# The Rust API is the single production service (it also serves the static web bundle).
[workspace]
resolver = "2"
members = ["apps/api", "migrations"]

[workspace.package]
edition = "2021"
rust-version = "1.96"
license = "AGPL-3.0-only"
repository = "https://github.com/Ruchoir/ruchoir"

# Shared dependency versions. Pin exact minor versions here; keep AGENTS.md in sync.
[workspace.dependencies]
tokio = { version = "1.53", features = ["rt-multi-thread", "net", "macros", "signal", "time", "sync", "fs", "process"] }
# `ws` powers the real-time WebSocket transport; SSE is in axum core.
axum = { version = "0.8", features = ["ws", "multipart"] }
tower = "0.5"
# Stream utilities: split a WebSocket into sink/stream and combine event streams. `futures-util`
# is the rust-lang community async foundation (neutral governance, per the no-US-dependency rule).
futures-util = "0.3"
# Wrap Tokio channels as `Stream`s for the SSE fan-out response (tokio ecosystem).
tokio-stream = { version = "0.1", features = ["sync"] }
tower-http = { version = "0.7", features = ["fs", "trace", "set-header", "cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Loads a local `.env` for `cargo run` (dev convenience). Community, MIT: compliant with the
# no-US-dependency rule. Never overrides variables already set in the real environment.
dotenvy = "0.15"
# OpenAPI generation from code (dynamic, always in sync). `utoipa` is community,
# EU-authored: compliant with the no-US-dependency rule.
utoipa = { version = "5", features = ["axum_extras", "uuid"] }
# Optional dev TLS. Uses the community `ring` crypto provider (not AWS `aws-lc-rs`),
# per the no-US-dependency rule. Enabled through the `tls` feature of apps/api.
axum-server = { version = "0.8", default-features = false, features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }

# --- Data layer ---
# SeaORM is the PostgreSQL ORM + versioned migrator (SeaQL, community, SG-based org: neutral
# governance per the no-US-dependency rule). Default features are disabled so we do NOT pull an
# implicit TLS provider: the `runtime-tokio` feature (no `-rustls`/`-native-tls` suffix) speaks
# plaintext, which is what dev uses over the trusted Docker network. When TLS-to-database is added
# later during hardening, enable the ring-based rustls path (never AWS `aws-lc-rs`), matching
# the crypto provider already chosen for the HTTP server.
sea-orm = { version = "2.0.2", default-features = false, features = [
    "sqlx-postgres",
    "runtime-tokio",
    "macros",
    "with-uuid",
    "with-time",
    "with-json",
    "postgres-array",
] }
sea-orm-migration = { version = "2.0.2", default-features = false, features = [
    "sqlx-postgres",
    "runtime-tokio",
] }
# `async-trait` backs the SeaORM migration trait implementations.
async-trait = "0.1.92"
# Valkey/RESP client for opaque sessions (and, later, presence / pub-sub). Community, MIT. Default
# features ("transactions", "i-std") cover keys/expire/ping/pub-sub with no TLS provider pulled;
# the `enable-rustls-ring` feature (ring, not aws-lc-rs) is the sovereign TLS path for later hardening.
# `subscriber-client` adds the dedicated pub/sub subscriber connection used by the real-time hub
# (a subscriber needs its own connection, separate from the command pool).
fred = { version = "10.1.0", features = ["subscriber-client"] }

# --- Auth (password hashing, sessions, cookies) ---
# argon2id password hashing (RustCrypto, community). getrandom (rust-random) sources CSPRNG bytes
# for session ids and salts. uuid/time are community crates; axum-extra provides the cookie jar
# (tokio ecosystem, already using axum). All local libraries: compliant with the dependency rule.
argon2 = "0.6"
getrandom = "0.4"
uuid = { version = "1.26", features = ["v4", "serde"] }
# `formatting` powers RFC 3339 serialization of message timestamps in the API DTOs.
time = { version = "0.3.55", features = ["formatting"] }
axum-extra = { version = "0.12.6", features = ["cookie"] }
# Coarse per-IP rate limiting layer for the auth routes (community; wraps `governor`). Default
# features pull `tonic` (gRPC), which we do not use: keep only the axum integration.
tower_governor = { version = "0.8", default-features = false, features = ["axum"] }
# SMTP client for verification / password-reset emails (community). rustls with the ring provider
# (never aws-lc-rs), matching the rest of the stack; webpki roots bundled.
lettre = { version = "0.11.23", default-features = false, features = [
    "tokio1",
    "tokio1-rustls-tls",
    "smtp-transport",
    "builder",
    "hostname",
] }
# SHA-256 for hashing single-use email tokens at rest (RustCrypto, community).
sha2 = "0.11"
# SHA-1 for the offline breached-password check (the public breach corpora are SHA-1 keyed).
sha1 = "0.11"
# HMAC-SHA-256 for hashing single-use recovery codes at rest (RustCrypto, community).
hmac = "0.13"
# --- MFA (TOTP + secret encryption at rest) ---
# TOTP (RFC 6238) for authenticator-app two-factor (community). AES-GCM (RustCrypto) encrypts the
# TOTP secret at rest; zeroize wipes key material from memory after use.
totp-rs = { version = "6", default-features = false, features = ["std", "otpauth"] }
aes-gcm = "0.11"
zeroize = "1.9"
# Pure-Rust QR encoder (Nayuki, community, zero deps): renders the TOTP provisioning URL to SVG,
# avoiding the heavy raster `image` stack that totp-rs's own `qr` feature would pull.
qrcodegen = "1.8"
# WebAuthn / passkeys (Kanidm project, AU-led community: neutral governance). Handles the
# registration and authentication ceremonies server-side. The `danger-allow-state-serialisation`
# feature is required (and safe here) to persist ceremony state server-side in Valkey between the
# start and finish steps, as the crate documents.
webauthn-rs = { version = "0.5.5", features = ["danger-allow-state-serialisation"] }

# --- Files / object storage ---
# S3 client for the object store (Garage by default). Community crate, recommended for sovereign S3
# access over the Amazon `aws-sdk-s3` (no-US-dependency rule). `default-features = false` with only
# `with-tokio` + `fail-on-err` pulls `reqwest` WITHOUT any TLS backend, so neither `aws-lc-rs` (AWS)
# nor OpenSSL enters the tree: dev talks plaintext to Garage over the trusted Docker network, exactly
# like PostgreSQL/Valkey. TLS-to-Garage is later hardening (the `ring` path, never aws-lc-rs).
# `aws-creds` is pulled transitively (part of the rust-s3 project; credential structs only).
rust-s3 = { version = "0.37.2", default-features = false, features = ["with-tokio", "fail-on-err"] }
# SVG to PNG for the link preview cards (`apps/api/src/og`). Linebender (community org, no company
# behind it), MIT/Apache-2.0, pure Rust. Without the default `system-fonts`/`memmap-fonts`: the fonts
# are embedded in the binary, so nothing is read from the host. See docs/adr/0002-link-preview-cards.md.
resvg = { version = "0.48.1", default-features = false, features = ["text", "raster-images"] }
# Image decode/resize/encode for server-side thumbnails (community image-rs org). Restricted to the
# web formats we accept so no heavy/native codec (avif/openexr) is pulled.
image = { version = "0.25.10", default-features = false, features = [
    "jpeg",
    "png",
    "gif",
    "webp",
    "rayon",
] }
# Magic-byte MIME sniffing so the stored content type never trusts the client (community, MIT).
infer = "0.22.0"

# --- Import (reading an archive produced by our export tooling) ---
# OpenPGP, to open the sealed archive an administrator hands over. rPGP is pure Rust with no C
# toolchain to build (unlike Sequoia, which needs Nettle), and its maintainers are the Delta Chat
# team in Germany: European governance, per the no-US-dependency rule. Arbitrated 2026-09-13.
pgp = "0.20"
# Reading the tar inside the archive as a stream. A multi-gigabyte import is never held in memory.
tar = "0.4"

# --- Notifications past the open page (see docs/adr/0001-web-push.md) ---
# P-256 (RustCrypto, community): ECDSA signs the VAPID token that identifies this instance to a
# browser's push service (RFC 8292), and ECDH encrypts each push's constant marker for the browser
# (RFC 8291, with the `aes-gcm` and `hmac` crates already in the tree).
p256 = { version = "0.14.0", default-features = false, features = ["ecdsa", "ecdh", "std"] }
# Blocking HTTP client for the one outbound call the API makes, to a push service (ureq, maintained
# in Sweden by Martin Algesten, MIT/Apache-2.0). Default features are replaced so TLS is rustls with
# the `ring` provider and bundled roots (never aws-lc-rs), and nothing else (no gzip) is pulled.
# Called from `spawn_blocking`, which is cheaper to vet than a second async stack.
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }

[profile.release]
# Lean, fast production binary.
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
